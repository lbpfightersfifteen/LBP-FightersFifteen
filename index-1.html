<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViewCash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151922;--card2:#1c2230;--tx:#f3efe6;--mut:#9aa3b5;--gold:#e5b94e;--gold2:#b98a1f;--ok:#4cd08a;--err:#ff6b6b;--bd:#2a3144;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Inter',system-ui,sans-serif}
body{max-width:480px;margin:auto;padding:16px 16px 90px}
h2{font-size:18px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.bal{background:linear-gradient(135deg,#2a2110,#14110a);border-color:var(--gold2)}
.bal b{font-size:32px;color:var(--gold);display:block}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:18px;padding:14px;position:relative;overflow:hidden}
.pk.pop{border-color:var(--gold)}
.pk .tag{position:absolute;top:0;right:0;background:var(--gold);color:#201700;font-size:11px;font-weight:700;padding:3px 10px;border-radius:0 0 0 12px}
.pk h3{font-size:12px;color:var(--gold);letter-spacing:1px}
.pk .pr{font-size:28px;font-weight:700;margin:4px 0}
.pk li{list-style:none;font-size:12.5px;color:var(--mut);margin:3px 0}
.pk.on{border-color:var(--ok)}
button,input{font:inherit}
.btn{width:100%;border:0;border-radius:12px;padding:11px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#201700;margin-top:8px}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:12px;margin-top:6px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;display:flex;background:#10131a;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:10px;cursor:pointer}
.nav button.a{color:var(--gold)}
.nav span{display:block;font-size:20px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}
.pos{color:var(--ok)}.neg{color:var(--err)}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.modal.s{display:flex}
.ad{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:22px;width:100%;max-width:380px;text-align:center}
.ad .ph{height:150px;border-radius:14px;background:linear-gradient(135deg,#3a2c0b,#1a2a44);display:flex;align-items:center;justify-content:center;font-size:40px;margin:12px 0}
.tm{font-size:36px;color:var(--gold);font-weight:700}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:20;display:none;font-size:14px;max-width:90%}
.hide{display:none}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;text-align:center}
.logo{font-size:44px;color:var(--gold)}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;font-size:14px}.me{background:var(--gold2);color:#fff;margin-left:auto}.ad2{background:var(--card2)}.x{background:none;border:0;color:var(--err);cursor:pointer;font-size:12px}.chat{max-height:46vh;overflow:auto;display:flex;flex-direction:column}.bd{padding:2px 9px;border-radius:8px;font-size:12px;font-weight:700}.pd{background:#3a2c0b;color:var(--gold)}.su{background:#10301f;color:var(--ok)}.rj{background:#3a1717;color:var(--err)}.cnt{font-size:12px;color:var(--gold);margin:2px 0 6px}.sm{width:auto;padding:6px 12px;margin:0 0 0 6px}.fl{display:flex;align-items:center}.abx{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:16px 8px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-family:inherit}.news{background:#3a1717;border:1px solid var(--err);border-radius:12px;padding:7px 0;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-size:13px;text-align:left}.news b{background:var(--err);color:#fff;padding:2px 8px;border-radius:6px;margin-left:8px;font-size:11px;white-space:nowrap}.news div{overflow:hidden;flex:1}.news span{display:inline-block;white-space:nowrap;padding-left:100%;animation:mq 14s linear infinite}@keyframes mq{to{transform:translateX(-100%)}}.bell{position:relative;font-size:22px;background:none;border:0;cursor:pointer;color:var(--tx)}.bell i{position:absolute;top:-6px;right:-8px;background:var(--err);color:#fff;font-size:10px;font-style:normal;padding:1px 6px;border-radius:8px}</style></head><body>
<div class="toast" id="toast"></div>

<div id="login" class="login"></div>

<div id="app" class="hide">
 <div id="v"></div>
 <div class="nav" id="nav"></div>
</div>

<div class="modal" id="md"><div class="ad">
 <div class="mut">Ad playing</div>
 <div class="ph">🎬</div>
 <div class="tm" id="tm">20</div>
 <p class="mut" id="tmsg">Wait until the timer ends to earn the reward</p>
 <div class="bar"><i id="pb" style="width:0"></i></div>
 <button class="btn g" onclick="closeAd()">Close</button>
</div></div>

<script>
const PK=[{p:50,d:25,c:128},{p:100,d:20,c:96},{p:200,d:18,c:64,pop:1},{p:400,d:15,c:31}];
PK.forEach((k,i)=>k.n=['Starter','Silver','Gold','Diamond'][i]);
const LV=[2,0.5,0.05],TPD=10,SEC=20,RB=5,MIN=10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let NEWS='',CP=[],NT=[{t:'Welcome to ViewCash!',time:'',r:0}];const FREE={p:10,d:15};const FAKE=[['01711***210',14,[1,3],500,120,'VC711210'],['01819***442',11,[0,1,2],350,90,'VC819442'],['01955***083',9,[2],200,40,'VC955083'],['01612***775',6,[0],50,0,'VC612775'],['01388***901',3,[1],100,0,'VC388901']];
const dstr=()=>new Date(Date.now()+OFF*864e5).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const UD={};const newU=p=>({phone:p,name:'',email:'',bal:0,pk:[],refs:0,refEarn:0,tx:[],tT:0,tR:0,req:[],ci:[],inT:0,outT:0,free:'none',refBy:'',rin:'',date:'',locked:false,frozen:false,lastIn:'—',lastOut:'—'});
const FM=FAKE.map((m,i)=>({phone:['01711234210','01819345442','01955456083','01612567775','01388678901'][i],name:['Karim','Sumi','Jahid','Nasrin','Sohel'][i],bal:[42.5,120,15.2,8,60][i],pk:m[2].map(x=>({n:PK[x].n,p:PK[x].p,d:PK[x].d})),lastIn:['Oct 22, 2026','Oct 20, 2026','Oct 18, 2026','Oct 10, 2026','Oct 24, 2026'][i],lastOut:['Oct 21, 2026','Oct 15, 2026','—','—','—'][i],locked:false,frozen:false}));
const RM=()=>Object.values(UD);const validRef=r=>FAKE.some(m=>m[5]==r)||RM().some(m=>'VC'+m.phone.slice(-6)==r);
function creditRef(b,price){if(!b.refBy||b.refPaid)return;b.refPaid=true;let id=b.refBy;for(let l=0;l<3&&id;l++){const m=RM().find(x=>'VC'+x.phone.slice(-6)==id);const bonus=price*LV[l]/100;if(m){m.bal+=bonus;m.refEarn+=bonus;m.tR+=bonus;if(l==0)m.refs++;m.tx.unshift({t:'Referral bonus (Level '+(l+1)+')',a:bonus});notify('Referral bonus '+f(bonus)+' (Level '+(l+1)+')');id=m.refBy}else{const fk=FAKE.find(x=>x[5]==id);if(fk&&l==0)fk[1]++;break}}}const findM=q=>{q=(q||'').trim();if(q.length<4)return null;return [...FM,...RM()].find(m=>m.phone==q||m.phone.endsWith(q))||null};
let CHAT=[{f:'a',t:'Welcome to ViewCash! How can we help you?'}],U={phone:'',bal:0,pk:[],refs:0,refEarn:0,tx:[],tT:0,tR:0,req:[],ci:[],inT:0,outT:0,free:'none',refBy:'',rin:'',date:'',locked:false,frozen:false,lastIn:'—',lastOut:'—'},tab='home',ADT=null,ADS=0,CUR=0,OFF=0,RID=1,AS=null,SQ='',ADM=false,WS=null,CI={pi:null,m:'bKash',step:0},CO={m:null,num:'',amt:''};const PAYS={bKash:{on:true,type:'Personal',num:'01700-000001'},Nagad:{on:true,type:'Payment',num:'01800-000002'},Rocket:{on:false,type:'Personal',num:'01900-000003'}},RATE={in:125,out:120},bd=n=>'৳'+Math.round(n).toLocaleString('en-US');
const $=id=>document.getElementById(id),f=n=>'$'+(+n).toFixed(2);
const td=()=>new Date(Date.now()+OFF*864e5).toDateString();
const myId=()=>'VC'+U.phone.slice(-6);const rw=k=>k.p/k.d/TPD,dly=k=>k.p/k.d;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function log(t,a){U.tx.unshift({t,a})}
function sync(){const d=td();if(U.date&&U.date!=d){U.tT=0;U.tR=0}U.date=d;U.pk.forEach(k=>{if(k.date!=d){if(k.date)k.day=Math.min(k.d,k.day+1);k.done=0;k.date=d}})}
const ACC={'01712345678':{name:'Demo Member',email:'demo@viewcash.com'},'01911223344':{name:'Rahim Uddin',email:'rahim@mail.com'}};
let AM='in';const BD=/^01[3-9]\d{8}$/;
function authView(){const T=[['in','Log In'],['up','Sign Up'],['hp','💬 Help']];
 const B=AM=='in'?`<p class="mut">Log in with your Bangladeshi mobile number</p><input id="ph" type="tel" inputmode="numeric" placeholder="01XXXXXXXXX" maxlength="11"><button class="btn" onclick="doLogin()">Log In</button><p class="mut" style="margin-top:14px">Demo number: 01712345678</p>`:AM=='up'?`<p class="mut">Create your account</p><input id="sn" placeholder="Full name"><input id="se" type="email" placeholder="Email"><input id="sp" type="tel" inputmode="numeric" placeholder="Mobile number (01XXXXXXXXX)" maxlength="11"><input id="srf" placeholder="Referral ID (optional)"><button class="btn" onclick="doSignup()">Sign Up</button>`:AM=='ad'?`<p class="mut">Admin login</p><input id="au" placeholder="Admin username"><input id="apw" type="password" placeholder="Password"><button class="btn" onclick="adminLogin()">Admin Log In</button>`:`<p class="mut">Can't log in? Chat live with the admin.</p><div class="card"><div class="chat">${msgs(0)}</div><input id="gn" type="tel" placeholder="Your mobile number (optional)" maxlength="11"><input id="gm" placeholder="Type your message..." onkeydown="if(event.key=='Enter')gSend()"><button class="btn" onclick="gSend()">Send</button></div>`;
 $('login').innerHTML=newsBar()+`<div class="logo">♛</div><h1 style="font-size:26px">ViewCash</h1><div class="grid" style="margin:16px 0 8px;grid-template-columns:repeat(3,1fr)">${T.map(t=>`<button class="btn ${AM==t[0]?'':'g'}" onclick="AM='${t[0]}';authView()">${t[1]}</button>`).join('')}</div>`+B+`<button class="x" style="color:var(--mut);font-size:13px;margin-top:18px" onclick="AM='ad';authView()">🛠 Admin Login</button>`;
 const c=document.querySelector('#login .chat');if(c)c.scrollTop=c.scrollHeight}
function adminLogin(){const u=$('au').value.trim(),p=$('apw').value;if(u!='admin'||p!='admin123')return toast('Wrong admin username or password');ADM=true;AS=null;$('login').classList.add('hide');$('app').classList.remove('hide');go('adm')}
function gSend(){const n=$('gn').value.trim(),m=$('gm').value.trim();if(!m)return;CHAT.push({f:'m',t:(n?'['+n+'] ':'')+m});authView();setTimeout(()=>{CHAT.push({f:'a',t:'Thanks! An admin will reply shortly.'});if(AM=='hp'&&!$('login').classList.contains('hide'))authView()},1200)}
function enter(v){if(UD[v]&&UD[v].locked)return toast('Your account is locked. Contact the admin via Help.');U=UD[v]||(UD[v]=Object.assign(newU(v),{name:ACC[v].name,email:ACC[v].email,refBy:ACC[v].ref||''}));$('login').classList.add('hide');$('app').classList.remove('hide');go('home')}
function doLogin(){const v=$('ph').value.trim();if(!BD.test(v))return toast('Enter a valid Bangladeshi mobile number');if(!ACC[v])return toast('Number not registered. Please sign up.');enter(v)}
function doSignup(){const n=$('sn').value.trim(),e=$('se').value.trim().toLowerCase(),p=$('sp').value.trim();if(n.length<3)return toast('Enter your full name');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast('Enter a valid email');if(!BD.test(p))return toast('Enter a valid Bangladeshi mobile number');if(ACC[p])return toast('This number is already registered');const rf=$('srf').value.trim().toUpperCase();if(rf&&!validRef(rf))return toast('Invalid referral ID');if(Object.values(ACC).some(a=>a.email==e))return toast('This email is already used');ACC[p]={name:n,email:e,ref:rf};toast('Account created ✔');enter(p)}
function go(t){if(t=='x'){ADM=false;logout();return}tab=t;WS=null;const N=ADM?[['adm','🛠','Admin'],['x','🚪','Logout']]:[['home','🏠','Home'],['task','🎬','Tasks'],['ref','👥','Refer'],['wal','💰','Wallet'],['chat','💬','Chat'],['pro','👤','Profile']];
 $('nav').innerHTML=N.map(n=>`<button class="${n[0]==t?'a':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');render()}
function logout(){$('app').classList.add('hide');$('login').classList.remove('hide');AM='in';authView()}
function notify(t){NT.unshift({t,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),r:0})}
function newsBar(){return NEWS?`<div class="news"><b>BREAKING</b><div><span>${esc(NEWS)}</span></div></div>`:''}
function hdr(){if(ADM)return `<div class="fl" style="margin-bottom:10px"><b style="font-size:18px;color:var(--gold)">♛ ViewCash Admin</b></div>`;const u=NT.filter(n=>!n.r).length,w=U.locked?'<div class="card" style="border-color:var(--err);color:var(--err)">🔒 Your account is locked. Cash out is disabled. Contact the admin in Chat.</div>':U.frozen?'<div class="card" style="border-color:var(--err);color:var(--err)">❄ Your balance is frozen. Cash out is disabled. Contact the admin in Chat.</div>':'';return `<div class="fl" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:18px;color:var(--gold)">♛ ViewCash</b><button class="bell" onclick="go('nt')">🔔${u?`<i>${u}</i>`:''}</button></div>`+newsBar()+w}
function nt(){const L=NT.map(n=>`<div class="row"><span>${esc(n.t)}${n.r?'':' <span class="bd pd">new</span>'}</span><span class="mut">${n.time}</span></div>`).join('');NT.forEach(n=>n.r=1);return `<h2 style="margin-top:0">🔔 Notifications</h2><div class="card">${L||'<span class="mut">No notifications</span>'}</div>`}
function render(){sync();const V={home,task,ref,wal,chat,pro,adm,nt};const body=V[tab]();$('v').innerHTML=hdr()+body;const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight}
const has=i=>U.pk.some(x=>x.i==i);
function head(){const t=U.pk.reduce((a,x)=>a+x.p,0);return `<div class="card bal"><span class="mut">ViewCash Balance</span><b>${f(U.bal)}</b><span class="mut">Active packages: ${U.pk.length} · Total ${f(t)}</span></div>`}
function today(){return `<div class="card"><b>Today's Income</b><div class="row"><span>Task earnings</span><b class="pos">${f(U.tT)}</b></div><div class="row"><span>Referral earnings</span><b class="pos">${f(U.tR)}</b></div><div class="row"><span><b>Total today</b></span><b style="color:var(--gold)">${f(U.tT+U.tR)}</b></div></div>`}
function home(){const fs=U.free;return head()+`<div class="grid" style="margin-bottom:12px"><button class="abx" onclick="go('wal');WS='in';render()"><span style="font-size:30px">📥</span><b>Cash In</b></button><button class="abx" onclick="go('wal');WS='out';render()"><span style="font-size:30px">📤</span><b>Cash Out</b></button></div>`+today()+`<div class="card"><b>Referral ID</b><p class="mut">Your ID: <b style="color:var(--gold)">${myId()}</b>. Enter a friend's ID when buying a package.</p><input id="rf" placeholder="Referral ID (optional)" value="${U.refBy||U.rin}" ${U.refBy?'readonly':''} oninput="U.rin=this.value"></div><h2>Premium Packages</h2><div class="grid">`+PK.map((k,i)=>`<div class="pk ${k.pop?'pop':''} ${has(i)?'on':''}">${k.pop?'<div class="tag">POPULAR</div>':''}<h3>${k.n.toUpperCase()}</h3><div class="pr">${f(k.p)}</div><div class="cnt">👥 ${k.c} members bought</div><ul><li>✔ ${TPD} tasks per day</li><li>✔ ${f(rw(k))} per task</li><li>✔ ${f(dly(k))} per day</li></ul><button class="btn" ${has(i)?'disabled':''} onclick="buy(${i})">${has(i)?'Purchased ✔':'Buy Now'}</button></div>`).join('')+`</div><div class="pk" style="margin-top:12px;border-color:var(--ok)"><div class="tag" style="background:var(--ok)">FREE</div><h3 style="color:var(--ok)">FREE</h3><div class="pr">$0.00</div><ul><li>✔ ${TPD} tasks per day</li><li>✔ ${f(FREE.p/FREE.d)} per day</li></ul><button class="btn" ${fs!='none'||U.pk.some(x=>x.i!=='F')?'disabled':''} onclick="reqFree()">${fs=='Ended'?'Ended (package bought)':fs=='Pending'?'Pending approval…':fs=='Active'?'Active ✔':U.pk.length?'Not available':'Request Free'}</button></div><p class="mut" style="margin-top:12px">You can own several packages, but each package can be bought only once.</p>`}
function reqFree(){if(U.free!='none')return;if(U.pk.some(x=>x.i!=='F'))return toast('Free is not available after buying a package');U.free='Pending';toast('Free request sent: waiting for admin approval');render()}
function freeDecide(p,ok){const m=UD[p];if(!m||m.free!='Pending')return;if(ok){m.free='Active';m.pk.push({i:'F',p:FREE.p,n:'Free',d:FREE.d,day:1,done:0,date:td()});notify('Your Free package request was approved');toast('Approved: account active with Free package ✔')}else{m.free='none';notify('Your Free package request was rejected');toast('Free request rejected')}render()}
function buy(i){const k=PK[i];if(has(i))return toast('You already own this package');const r=(U.refBy||U.rin||'').trim().toUpperCase();if(r&&!U.refBy&&(r==myId()||!validRef(r)))return toast('Invalid referral ID');if(U.bal<k.p){toast('Insufficient balance. Please cash in.');return go('wal')}
 if(r&&!U.refBy){U.refBy=r;toast('Referral ID '+r+' applied')}
 U.bal-=k.p;k.c++;creditRef(U,k.p);U.pk.push({i,p:k.p,n:k.n,d:k.d,day:1,done:0,date:td()});log('Bought '+k.n+' '+f(k.p),-k.p);if(U.free=='Active'||U.free=='Pending'){U.pk=U.pk.filter(x=>x.i!=='F');U.free='Ended'}toast('Package activated ✔');render()}
function task(){if(!U.pk.length)return head()+'<div class="card">Buy a package first to start tasks.</div>';
 return head()+U.pk.map((k,i)=>{const fin=k.day>=k.d&&k.done>=TPD,dn=k.done>=TPD;return `<div class="card"><b>${k.n} ${f(k.p)}</b><div class="bar"><i style="width:${k.day/k.d*100}%"></i></div><p class="mut" style="margin:6px 0">Day ${k.day}/${k.d} · Today ${k.done}/${TPD} · ${f(rw(k))} per task</p><div class="bar"><i style="width:${k.done/TPD*100}%;background:var(--ok)"></i></div><button class="btn" ${dn?'disabled':''} onclick="startAd(${i})">${dn?(fin?'Package completed ✔':'Done for today · new tasks tomorrow'):'Watch next ad ('+(k.done+1)+'/'+TPD+')'}</button></div>`}).join('')+'<p class="mut">Tasks are given once per day and reset at the start of the next day.</p><button class="btn g" onclick="OFF++;toast(\'Simulated next day\');render()">⏭ Simulate next day (demo)</button>'}
function startAd(i){const k=U.pk[i];if(ADT||k.done>=TPD)return;CUR=i;ADS=SEC;$('md').classList.add('s');$('tm').textContent=ADS;$('pb').style.width='0';
 ADT=setInterval(()=>{ADS--;$('tm').textContent=ADS;$('pb').style.width=(SEC-ADS)/SEC*100+'%';if(ADS<=0){clearInterval(ADT);ADT=null;const k=U.pk[CUR];if(k.done<TPD){const r=rw(k);U.bal+=r;U.tT+=r;k.done++;log('Task reward',r);toast('Reward added +'+f(r))}$('md').classList.remove('s');render()}},1000)}
function closeAd(){if(ADT){clearInterval(ADT);ADT=null;toast('Closed before the timer ended: no reward ✖')}$('md').classList.remove('s')}
function ref(){const L=[...FAKE.map(m=>({n:m[0],r:m[1]})),{n:'You ('+U.phone.slice(0,5)+'***)',r:U.refs,me:1}].sort((a,b)=>b.r-a.r);
 return head()+`<div class="card"><span class="mut">Your referral code</span><b style="display:block;font-size:22px;color:var(--gold)">${myId()}</b><p class="mut">Successful referrals: ${U.refs} · Pending: ${RM().filter(m=>m.refBy==myId()&&!m.refPaid).length} · Earnings: ${f(U.refEarn)}</p><p class="mut" style="margin-top:6px">A referral counts as successful only after the member buys a premium package. Signing up or taking the Free package does not count.</p></div><h2>Purchase Bonus (3 levels)</h2><div class="card">${LV.map((v,i)=>`<div class="row"><span>Level ${i+1}</span><b class="pos">${v}%</b></div>`).join('')}</div><h2>Work Bonus</h2><div class="card"><p class="mut">When your referred member completes tasks, you earn ${RB}% of their task reward.</p></div><h2>🏆 Member Ranking</h2><div class="card">${L.map((m,i)=>`<div class="row" ${m.me?'style="color:var(--gold)"':''}><span>#${i+1} ${m.n}</span><b>${m.r} referrals</b></div>`).join('')}</div><button class="btn g" onclick="simRef(0)">➕ Level 1 member bought $100 (demo)</button><button class="btn g" onclick="simRef(1)">➕ Level 2 member bought $100 (demo)</button><button class="btn g" onclick="simRef(2)">➕ Level 3 member bought $100 (demo)</button><button class="btn" onclick="simWork()">⚡ Referral did 10 tasks today (demo)</button>`}
function simRef(l){if(l==0)U.refs++;const b=100*LV[l]/100;U.bal+=b;U.refEarn+=b;U.tR+=b;log('Referral bonus (Level '+(l+1)+')',b);toast('Bonus +'+f(b));render()}
function simWork(){if(!U.refs)return toast('Add a Level 1 member first');const b=PK[1].p/PK[1].d/TPD*TPD*RB/100*U.refs;U.bal+=b;U.refEarn+=b;U.tR+=b;log('Referral work bonus',b);toast('Work bonus +'+f(b));render()}
const bdg=s=>`<span class="bd ${s=='Pending'?'pd':s=='Success'?'su':'rj'}">${s}</span>`;
function ciBox(){const ms=Object.keys(PAYS).filter(m=>PAYS[m].on);if(!ms.length)return '<div class="card">Cash in is unavailable right now. Please contact the admin.</div>';if(!ms.includes(CI.m))CI.m=ms[0];const k=CI.pi!==null?PK[CI.pi]:null,P=PAYS[CI.m],bt=k?k.p*RATE.in:0;
 if(CI.step==1)return `<div class="card"><b>Confirm Payment</b><p class="mut">Send ${bd(bt)} (${k.n} · ${f(k.p)}) to ${P.num} via ${CI.m} ${P.type}, then enter your details.</p><input id="cn" type="tel" placeholder="Your ${CI.m} number (sender)"><input id="ct" placeholder="Transaction ID"><button class="btn" onclick="ciSubmit()">Submit</button><button class="btn g" onclick="CI.step=0;render()">Back</button></div>`;
 return `<div class="card"><b>Cash In</b><p class="mut">Dollar rate: $1 = ${bd(RATE.in)}</p><p class="mut" style="margin-top:8px">1. Select package</p><div class="grid">${PK.map((x,i)=>`<button class="btn ${CI.pi===i?'':'g'}" onclick="CI.pi=${i};render()">${x.n}<br>${f(x.p)}</button>`).join('')}</div><p class="mut" style="margin-top:10px">2. Payment method</p><div class="grid">${ms.map(m=>`<button class="btn ${CI.m==m?'':'g'}" onclick="CI.m='${m}';render()">${m} ${PAYS[m].type}</button>`).join('')}</div>${k?`<div class="card" style="margin-top:12px;background:var(--card2)"><div class="row"><span>Package</span><b>${k.n} (${f(k.p)})</b></div><div class="row"><span>Amount to send</span><b class="pos">${bd(bt)}</b></div><div class="row"><span>${CI.m} ${P.type}</span><b>${P.num}</b></div></div><button class="btn" onclick="CI.step=1;render()">Submit</button>`:''}</div>`}
function ciSubmit(){const n=$('cn').value.trim(),t=$('ct').value.trim();if(!/^01\d{9}$/.test(n))return toast('Enter a valid 11-digit number');if(t.length<6)return toast('Enter a valid Transaction ID');const k=PK[CI.pi];U.ci.unshift({id:RID++,n:k.n,a:k.p,bdt:k.p*RATE.in,m:CI.m,num:n,trx:t,s:'Pending'});CI={pi:null,m:CI.m,step:0};WS=null;toast('Submitted: Pending admin verification');render()}
function coBox(){const ms=['bKash','Nagad','Rocket'];return `<div class="card"><b>Cash Out</b><p class="mut">Dollar rate: $1 = ${bd(RATE.out)} · Minimum ${f(MIN)} · at least 2 referrals (yours: ${U.refs})</p><p class="mut" style="margin-top:8px">Choose how you want to receive money</p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${ms.map(m=>`<button class="btn ${CO.m==m?'':'g'}" onclick="coSel('${m}')">${m}</button>`).join('')}</div>${CO.m?`<p class="mut" style="margin-top:10px">${CO.m} Personal</p><input id="cp" type="tel" placeholder="${CO.m} Personal number" value="${CO.num}"><input id="wa" type="number" placeholder="Cash out amount ($)" value="${CO.amt}" oninput="coCalc()"><div class="row"><span>You will receive</span><b id="cbd" class="pos">${bd((+CO.amt||0)*RATE.out)}</b></div><button class="btn" onclick="cashOut()">Request Cash Out</button>`:'<p class="mut" style="margin-top:10px">Select a method to continue</p>'}</div>`}
function coCalc(){CO.amt=$('wa').value;$('cbd').textContent=bd((+CO.amt||0)*RATE.out)}
function coSel(m){if($('cp'))CO.num=$('cp').value;if($('wa'))CO.amt=$('wa').value;CO.m=m;render()}
function wal(){const R=[...U.ci.map(r=>({id:r.id,t:'Cash In · '+r.n+' · '+f(r.a)+' ('+bd(r.bdt)+')',s:r.s})),...U.req.map(r=>({id:r.id,t:'Cash Out · '+r.m+' · '+f(r.a)+' ('+bd(r.bdt)+')',s:r.s}))].sort((a,b)=>b.id-a.id);
 const hist=`<h2>Requests</h2><div class="card">${R.length?R.map(r=>`<div class="row"><span>#${r.id} ${r.t}</span>${bdg(r.s)}</div>`).join(''):'<span class="mut">No requests yet</span>'}</div><h2>Transactions</h2><div class="card">${U.tx.length?U.tx.map(x=>`<div class="row"><span>${x.t}</span><b class="${x.a>=0?'pos':'neg'}">${x.a>=0?'+':''}${f(x.a)}</b></div>`).join(''):'<span class="mut">No transactions yet</span>'}</div>`;
 if(!WS)return head()+`<div class="grid"><button class="abx" onclick="WS='in';render()"><span style="font-size:30px">📥</span><b>Cash In</b></button><button class="abx" onclick="WS='out';render()"><span style="font-size:30px">📤</span><b>Cash Out</b></button></div>`+hist;
 return head()+`<button class="btn g" style="margin:0 0 12px" onclick="WS=null;render()">← Back</button>`+(WS=='in'?ciBox():coBox())}
function cashOut(){if(U.locked)return toast('Your account is locked. Contact the admin.');if(U.frozen)return toast('Your balance is frozen. You cannot cash out.');const a=+$('wa').value,n=$('cp').value.trim();CO.num=n;CO.amt=$('wa').value;if(U.refs<2)return toast('You need 2 referrals to cash out');if(!/^01\d{9}$/.test(n))return toast('Enter a valid '+CO.m+' number');if(!(a>=MIN))return toast('Minimum cash out is '+f(MIN));if(a>U.bal)return toast('Insufficient balance');U.bal-=a;U.req.unshift({id:RID++,date:dstr(),a,bdt:a*RATE.out,m:CO.m,num:n,s:'Pending'});log('Cash out requested',-a);CO={m:null,num:'',amt:''};toast('Request submitted: Pending');render()}
function decide(p,id,ok){const m=UD[p],r=m&&m.req.find(x=>x.id==id);if(!r||r.s!='Pending')return;if(ok&&(m.locked||m.frozen))return toast('Member is locked or frozen');r.s=ok?'Success':'Rejected';if(ok){m.outT+=r.a;m.lastOut=dstr()}else{m.bal+=r.a;m.tx.unshift({t:'Cash out refunded',a:r.a})}notify(ok?'Cash out '+f(r.a)+' approved: Success':'Cash out rejected, amount refunded');toast(ok?'Cash out approved ✔':'Request rejected, refunded');render()}
function ciDecide(p,id,ok){const m=UD[p],r=m&&m.ci.find(x=>x.id==id);if(!r||r.s!='Pending')return;r.s=ok?'Success':'Rejected';if(ok){m.inT+=r.a;m.bal+=r.a;m.lastIn=dstr();m.tx.unshift({t:'Cash in approved ('+r.n+')',a:r.a})}notify(ok?'Cash in '+f(r.a)+' approved and added to your balance':'Cash in request #'+id+' was rejected');toast(ok?f(r.a)+' credited to member ✔':'Cash in rejected');render()}
function ciCard(){const L=RM().flatMap(m=>m.ci.filter(r=>r.s=='Pending').map(r=>({m,r})));return `<div class="card"><b>Pending Cash Ins</b>${L.length?L.map(({m,r})=>`<div class="row fl"><span style="flex:1">#${r.id} · ${m.phone}<br><span class="mut">${r.n} package · ${f(r.a)} · ${bd(r.bdt)}<br>${r.m} · ${r.num}<br>TrxID: ${esc(r.trx)}</span></span><button class="btn sm" onclick="ciDecide('${m.phone}',${r.id},1)">Submit</button><button class="btn g sm" onclick="ciDecide('${m.phone}',${r.id},0)">Reject</button></div>`).join(''):'<p class="mut">No pending cash ins</p>'}</div>`}
function msgs(adm){return CHAT.map((m,i)=>`<div class="msg ${(m.f=='m')==!adm?'me':'ad2'}">${m.t}${adm?` <button class="x" onclick="delMsg(${i})">🗑 Delete</button>`:''}</div>`).join('')}
function chat(){return `<div class="card"><b>💬 Live Chat with Admin</b><div class="chat" style="margin-top:8px">${msgs(0)}</div><input id="cm" placeholder="Type a message..." onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div>`}
function send(){const v=$('cm').value.trim();if(!v)return;CHAT.push({f:'m',t:v});render();setTimeout(()=>{CHAT.push({f:'a',t:'Thanks! An admin will reply shortly.'});if(tab=='chat')render()},1200)}
function delMsg(i){CHAT.splice(i,1);render()}
function pro(){return head()+`<div class="card"><div class="row"><span>Name</span><b>${U.name}</b></div><div class="row"><span>Email</span><b>${U.email}</b></div><div class="row"><span>Mobile</span><b>${U.phone}</b></div><div class="row"><span>My Referral ID</span><b style="color:var(--gold)">${myId()}</b></div><div class="row"><span>Referred by</span><b>${U.refBy||"—"}</b></div><div class="row"><span>Packages</span><b>${U.pk.length}</b></div><div class="row"><span>Referrals</span><b>${U.refs}</b></div><div class="row"><span>Referral earnings</span><b>${f(U.refEarn)}</b></div></div>${coHist()}${cpBox()}<button class="btn g" onclick="logout()">Log Out</button>`}
function box(k,ic,t,n){return `<button class="abx" onclick="AS='${k}';SQ='';render()"><span style="font-size:26px">${ic}</span><b>${t}</b>${n?`<span class="bd pd">${n} pending</span>`:''}</button>`}
function srCard(){const m=findM(SQ);return `<div class="card"><b>Search Member</b><input id="sq" type="tel" placeholder="Member mobile number" value="${esc(SQ)}" onkeydown="if(event.key=='Enter')doSearch()"><button class="btn" onclick="doSearch()">Search</button></div>`+(SQ?(m?mDetail(m):'<div class="card mut">No member found (enter at least 4 digits)</div>'):'')}
function doSearch(){SQ=$('sq').value;render()}
function mDetail(m){const st=[m.locked?'🔒 Locked':'',m.frozen?'❄ Frozen':''].filter(Boolean).join(' · ')||'✅ Active',pk=m.pk.length?m.pk.map(k=>`${k.n} ${f(k.p)}`).join(', '):'None',di=m.pk.reduce((a,k)=>a+k.p/k.d,0);
 return `<div class="card"><b>${esc(m.name||'Member')}</b><div class="row"><span>Mobile</span><b>${m.phone}</b></div><div class="row"><span>Status</span><b>${st}</b></div><div class="row"><span>Balance</span><b class="pos">${f(m.bal)}</b></div><div class="row"><span>Running packages</span><b style="text-align:right">${pk}</b></div><div class="row"><span>Daily income</span><b>${f(di)}</b></div><div class="row"><span>Last cash in</span><b>${m.lastIn}</b></div><div class="row"><span>Last cash out</span><b>${m.lastOut}</b></div></div><div class="card"><b>Actions</b><div class="grid" style="margin-top:8px"><button class="btn g" style="margin:0" onclick="toggle('${m.phone}','locked')">${m.locked?'🔓 Unlock account':'🔒 Lock account'}</button><button class="btn g" style="margin:0" onclick="toggle('${m.phone}','frozen')">${m.frozen?'Unfreeze balance':'❄ Freeze balance'}</button></div><input id="dd" type="number" placeholder="Deduct amount ($)"><button class="btn" onclick="deduct('${m.phone}')">Deduct from balance</button></div>`}
function toggle(p,k){const m=findM(p);if(!m)return;m[k]=!m[k];if(UD[p]===m)notify(k=='locked'?(m[k]?'Your account has been locked by admin':'Your account was unlocked'):(m[k]?'Your balance has been frozen by admin':'Your balance was unfrozen'));toast('Updated');render()}
function deduct(p){const m=findM(p),a=+$('dd').value;if(!m)return;if(!(a>0))return toast('Enter an amount');if(a>m.bal)return toast('Amount is more than the balance');m.bal-=a;if(UD[p]===m){m.tx.unshift({t:'Admin deduction',a:-a});notify('Admin deducted '+f(a)+' from your balance')}toast(f(a)+' deducted');render()}
function adm(){const R=RM(),pc=R.reduce((a,m)=>a+m.ci.filter(r=>r.s=='Pending').length,0),po=R.reduce((a,m)=>a+m.req.filter(r=>r.s=='Pending').length,0),pf=R.filter(m=>m.free=='Pending').length,oc=CP.filter(c=>c.s=='Open').length;
 if(!AS)return `<h2 style="margin-top:0">🛠 Admin Panel</h2><div class="grid">${box('sr','🔍','Search Member')}${box('ci','📥','Cash In Requests',pc)}${box('co','📤','Cash Out Requests',po)}${box('fr','🎁','Free Requests',pf)}${box('cf','📊','Cash In / Out Report')}${box('mb','👥','Members & Income')}${box('pc','📦','Package Counts')}${box('pr','💱','Payment & Rates')}${box('ab','➕','Add Balance')}${box('ch','💬','Member Chat')}${box('nw','📰','Breaking News')}${box('cp','🛎','Complaints',oc)}</div>`;
 const S={pr:prCard,sr:srCard,ci:ciCard,nw:newsCard,cp:cpCard,
 co:()=>{const L=R.flatMap(m=>m.req.filter(r=>r.s=='Pending').map(r=>({m,r})));return `<div class="card"><b>Pending Cash Outs</b>${L.length?L.map(({m,r})=>`<div class="row fl"><span style="flex:1">#${r.id} · ${m.phone} · ${f(r.a)} (${bd(r.bdt)})<br><span class="mut">${r.m} Personal · ${r.num}</span></span><button class="btn sm" onclick="decide('${m.phone}',${r.id},1)">Accept</button><button class="btn g sm" onclick="decide('${m.phone}',${r.id},0)">Reject</button></div>`).join(''):'<p class="mut">No pending requests</p>'}</div>`},
 fr:()=>{const L=R.filter(m=>m.free=='Pending');return `<div class="card"><b>Free Package Requests</b>${L.length?L.map(m=>`<div class="row fl"><span style="flex:1">${m.phone}<br><span class="mut">Free · earn ${f(FREE.p)} total</span></span><button class="btn sm" onclick="freeDecide('${m.phone}',1)">Approve</button><button class="btn g sm" onclick="freeDecide('${m.phone}',0)">Reject</button></div>`).join(''):'<p class="mut">No pending requests</p>'}<p class="mut" style="margin-top:8px">The account becomes active only after admin approval.</p></div>`},
 cf:()=>{const X=[...FAKE.map(m=>({n:m[0],i:m[3],o:m[4]})),...R.map(m=>({n:m.phone,i:m.inT,o:m.outT}))],ti=X.reduce((a,x)=>a+x.i,0),to=X.reduce((a,x)=>a+x.o,0);return `<div class="card bal"><div class="row"><span>Total Cash In</span><b class="pos">${f(ti)}</b></div><div class="row"><span>Total Cash Out</span><b class="neg">${f(to)}</b></div><div class="row"><span><b>Net (In − Out)</b></span><b style="color:var(--gold)">${f(ti-to)}</b></div></div><div class="card"><b>Per Member</b>${X.map(x=>`<div class="row"><span>${x.n}</span><span><span class="pos">In ${f(x.i)}</span> · <span class="neg">Out ${f(x.o)}</span></span></div>`).join('')}</div>`},
 mb:()=>`<div class="card"><b>Members, Packages &amp; Daily Income</b>${[...FM,...R].map(m=>`<div class="row"><span>${m.phone} ${m.locked?'🔒':''}${m.frozen?'❄':''}<br><span class="mut">${m.pk.length?m.pk.map(k=>k.n).join(', '):'No package'}</span></span><b class="pos">${f(m.pk.reduce((a,k)=>a+k.p/k.d,0))}/day</b></div>`).join('')}</div>`,
 pc:()=>`<div class="card"><b>Package Buyer Count</b><p class="mut">Set the number shown on each package. It also increases automatically with every purchase.</p>${PK.map((k,i)=>`<div class="row fl"><span style="flex:1">${k.n} ${f(k.p)}</span><input id="pc${i}" type="number" value="${k.c}" style="width:80px;margin:0"><button class="btn sm" onclick="setC(${i})">Set</button></div>`).join('')}</div>`,
 ab:()=>`<div class="card"><b>Add Balance</b><input id="abp" type="tel" placeholder="Member mobile number"><input id="ac" type="number" placeholder="Cash-in amount ($)"><button class="btn" onclick="adminIn()">Add Balance</button></div>`,
 ch:()=>`<div class="card"><b>Member Chat</b><p class="mut">Admin can reply and delete messages only (no editing).</p><div class="chat" style="margin-top:8px">${msgs(1)}</div><input id="ar" placeholder="Reply as admin..."><button class="btn" onclick="adminReply()">Send Reply</button></div>`};
 return `<button class="btn g" style="margin:0 0 12px" onclick="AS=null;render()">← Back</button>`+S[AS]()}
function setC(i){const v=parseInt($('pc'+i).value);if(!(v>=0))return toast('Enter a valid number');PK[i].c=v;toast('Count updated');render()}
function adminReply(){const v=$('ar').value.trim();if(!v)return;CHAT.push({f:'a',t:v});notify('Admin replied in Chat');render()}
function newsCard(){return `<div class="card"><b>Breaking News</b><p class="mut">Shown at the top of the site for everyone.</p>${NEWS?`<div class="row"><span>Current: ${esc(NEWS)}</span></div>`:''}<input id="nw" placeholder="Type breaking news..."><button class="btn" onclick="pubNews()">Publish</button>${NEWS?'<button class="btn g" onclick="NEWS=\'\';render()">Remove news</button>':''}</div>`}
function pubNews(){const v=$('nw').value.trim();if(!v)return toast('Type the news first');NEWS=v;notify('📰 Breaking: '+v);toast('News published');render()}
function cpCard(){return `<div class="card"><b>Member Complaints</b>${CP.length?CP.map(c=>`<div class="row" style="display:block"><b>#${c.id} ${esc(c.sub)}</b> <span class="bd ${c.s=='Open'?'pd':'su'}">${c.s}</span><br><span class="mut">${c.ph}</span><p style="font-size:14px">${esc(c.msg)}</p>${c.s=='Open'?`<input id="cr${c.id}" placeholder="Reply..."><button class="btn sm" style="margin:6px 0 0" onclick="cpResolve(${c.id})">Reply &amp; Resolve</button>`:`<span class="mut">Reply: ${esc(c.reply)}</span>`}</div>`).join(''):'<p class="mut">No complaints</p>'}</div>`}
function cpResolve(id){const c=CP.find(x=>x.id==id);if(!c||c.s!='Open')return;c.reply=$('cr'+id).value.trim()||'Resolved';c.s='Resolved';notify('Complaint #'+id+' resolved: '+c.reply);toast('Complaint resolved');render()}
function sendCp(){const a=$('cs').value.trim(),b=$('cb').value.trim();if(!a||b.length<5)return toast('Enter a subject and describe your issue');CP.unshift({id:RID++,ph:U.phone,s:'Open',sub:a,msg:b,reply:''});toast('Complaint submitted ✔');render()}
function cpBox(){const MC=CP.filter(c=>c.ph==U.phone);return `<div class="card"><b>Submit a Complaint</b><input id="cs" placeholder="Subject"><input id="cb" placeholder="Describe your issue"><button class="btn" onclick="sendCp()">Submit</button></div>${MC.length?`<div class="card"><b>My Complaints</b>${MC.map(c=>`<div class="row"><span>#${c.id} ${esc(c.sub)}${c.reply?`<br><span class="mut">Admin: ${esc(c.reply)}</span>`:''}</span><span class="bd ${c.s=='Open'?'pd':'su'}">${c.s}</span></div>`).join('')}</div>`:''}`}
function adminIn(){const p=$('abp').value.trim(),a=+$('ac').value,m=[...FM,...RM()].find(x=>x.phone==p);if(!m)return toast('Member not found (enter the full number)');if(!(a>0))return toast('Enter an amount');m.bal+=a;m.lastIn=dstr();if(UD[p]===m){m.inT+=a;m.tx.unshift({t:'Admin cash in',a});notify('Admin added '+f(a)+' to your balance')}toast(f(a)+' added ✔');render()}
function prCard(){return `<div class="card"><b>Dollar Rates (৳ per $1)</b><div class="row fl"><span style="flex:1">Cash In rate</span><input id="ri" type="number" value="${RATE.in}" style="width:90px;margin:0"></div><div class="row fl"><span style="flex:1">Cash Out rate</span><input id="ro" type="number" value="${RATE.out}" style="width:90px;margin:0"></div></div><div class="card"><b>Cash In Payment Methods</b><p class="mut">Members see only the methods enabled here, with the type and number you set.</p>${Object.keys(PAYS).map(m=>`<div style="margin:12px 0;padding-bottom:10px;border-bottom:1px solid var(--bd)"><label style="display:flex;align-items:center"><input type="checkbox" id="on${m}" ${PAYS[m].on?'checked':''} style="width:auto;margin:0 8px 0 0"><b>${m}</b></label><select id="ty${m}" style="width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:6px;font:inherit"><option ${PAYS[m].type=='Personal'?'selected':''}>Personal</option><option ${PAYS[m].type=='Payment'?'selected':''}>Payment</option></select><input id="nu${m}" value="${PAYS[m].num}" placeholder="${m} number"></div>`).join('')}<button class="btn" onclick="savePay()">Save</button></div>`}
function savePay(){const a=+$('ri').value,b=+$('ro').value;if(!(a>0)||!(b>0))return toast('Enter valid dollar rates');for(const m in PAYS){const n=$('nu'+m).value.trim();if(!n)return toast('Enter a number for '+m);PAYS[m]={on:$('on'+m).checked,type:$('ty'+m).value,num:n}}RATE.in=a;RATE.out=b;toast('Saved ✔');render()}
function coHist(){return `<div class="card"><b>Cash Out History</b>${U.req.length?U.req.map(r=>`<div class="row"><span>#${r.id} · ${r.date||''}<br><span class="mut">${r.m} · ${r.num} · ${f(r.a)} (${bd(r.bdt)})</span></span>${bdg(r.s)}</div>`).join(''):'<p class="mut">No cash outs yet</p>'}</div>`}
authView();</script></body></html>
